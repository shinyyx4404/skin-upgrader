<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:radial-gradient(circle at 50% 0,#1a1d26 0,var(--bg) 60%) fixed;color:var(--tx);font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif}
body{max-width:480px;margin:0 auto;padding:12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font-weight:900;letter-spacing:2px;color:var(--tx);font-size:17px}.logo span{color:var(--ac)}
.bal{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-weight:800;color:var(--ac)}
.arena{display:grid;grid-template-columns:1fr 156px 1fr;gap:6px;align-items:center}
.slot{background:linear-gradient(180deg,#1a1d26,#12141a);border:1px solid var(--line);border-radius:14px;min-height:130px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:11px;color:var(--mut)}
.slot b{display:block;color:var(--tx);font-size:12px}
.slot .pr{color:var(--ac);font-weight:800;margin-top:3px;font-size:12px}
.slot img{max-height:54px;max-width:100%;object-fit:contain;margin-bottom:4px}
.slot .chev{font-size:38px;color:var(--ac);opacity:.5;line-height:1}
.ring{position:relative;width:156px;height:156px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
#arc{filter:drop-shadow(0 0 4px currentColor);transition:stroke-dasharray .4s}
.ptr{position:absolute;inset:0;transition:transform 3.6s cubic-bezier(.12,.7,.1,1)}
.ptr i{position:absolute;left:50%;top:-4px;width:0;height:0;margin-left:-7px;border:7px solid transparent;border-top:12px solid #fff;filter:drop-shadow(0 0 3px #fff)}
.pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;font-weight:900}
.pct small{font-size:10px;color:var(--mut);font-weight:500;text-transform:uppercase;letter-spacing:1px}
.ring.win{animation:glow 1s 2}.ring.lose{animation:shake .4s 2}
@keyframes glow{50%{filter:drop-shadow(0 0 18px var(--ok))}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:12px 0 0}
.presets button{padding:8px 0;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-weight:800;font-size:12px}
.presets button:disabled{opacity:.35}.presets button:active{color:#000;background:var(--ac)}
.go{width:100%;margin:10px 0 6px;padding:15px;border:0;border-radius:12px;background:linear-gradient(180deg,#ffe14d,#ffc800);color:#000;font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:1px;box-shadow:0 4px 18px #ffd21f33}
.go:disabled{opacity:.35;box-shadow:none}
.msg{min-height:20px;text-align:center;font-weight:700;font-size:13px}
.tabs{display:flex;gap:6px;margin:8px 0}
.tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-weight:800}
.tabs button.on{color:#000;background:var(--ac);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sk{background:linear-gradient(160deg,var(--card) 45%,var(--g));border:1px solid var(--line);border-bottom:3px solid var(--c);border-radius:10px;padding:6px 4px;text-align:center;font-size:11px;color:var(--mut);min-height:96px;position:relative}
.sk b{display:block;color:var(--tx);font-size:11px;margin:2px 0;line-height:1.2}
.sk .pr{color:var(--ac);font-weight:800}
.sk .ch{display:block;color:var(--ok);font-size:10px;font-weight:700}
.sk .ic{font-size:24px;height:46px;display:flex;align-items:center;justify-content:center}
.ic img{max-width:100%;max-height:46px;object-fit:contain;filter:drop-shadow(0 2px 6px #000a)}
.sk.sel{outline:2px solid var(--ac)}
.row{display:flex;gap:6px;margin:8px 0}
.row button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-weight:700}
.row button:disabled{opacity:.35}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:24px}
.foot{margin-top:14px;text-align:center;font-size:11px;color:var(--mut)}
#ov{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
#ov.show{display:flex}
.ovc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center;width:100%;max-width:300px}
.ovc .big{font-size:60px;height:90px;display:flex;align-items:center;justify-content:center}
.ovc .big img{max-height:90px;max-width:100%}
.ovc h2{margin:6px 0 2px;font-size:20px}
.ovc button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--ac);font-weight:900}

.hist{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mut);margin:-4px 2px 10px}
.hist i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:4px}.hist i.w{background:var(--ok)}.hist i.l{background:var(--bad)}
.dep{display:flex;gap:5px;align-items:center;margin-top:8px;font-size:12px;color:var(--mut)}
.dep span{white-space:nowrap}.dep button{flex:1;padding:7px 0;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ac);font-weight:800;font-size:12px}
.dep button:disabled{opacity:.35}
#q{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:14px;margin-bottom:6px}
.chips{display:flex;gap:5px;margin-bottom:8px;overflow-x:auto}
.chips button{flex:none;padding:7px 12px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-weight:700;font-size:12px}
.chips button.on{color:#000;background:var(--ac);border-color:var(--ac)}
.more{grid-column:1/-1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ac);font-weight:800}

.nav{display:flex;gap:6px;margin-bottom:12px}
.nav button{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-weight:800;font-size:13px}
.nav button.on{color:#000;background:var(--ac);border-color:var(--ac)}
.cwin{position:relative;overflow:hidden;height:118px;background:#12141a;border:1px solid var(--line);border-radius:14px;margin:6px 0 12px}
.cwin:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1px;background:var(--ac);box-shadow:0 0 10px var(--ac);z-index:2}
#ctr{display:flex;height:100%;will-change:transform}
.ci{flex:none;width:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid var(--line);border-bottom:3px solid var(--c);background:linear-gradient(160deg,transparent 40%,var(--g));font-size:26px}
.ci img{max-width:78px;max-height:56px;object-fit:contain}.ci small{font-size:10px;color:var(--ac);font-weight:700;margin-top:4px}
.cinfo{text-align:center;color:var(--mut);font-size:12px;margin-bottom:6px}
h3{margin:16px 0 8px;font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.pf{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.av{width:60px;height:60px;border-radius:50%;background:#222733;border:2px solid var(--ac);display:flex;align-items:center;justify-content:center;font-size:32px;flex:none}
.pf input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--tx);font-size:18px;font-weight:800;padding:2px 0;outline:0}
.xp{height:7px;background:#222733;border-radius:4px;margin-top:8px;overflow:hidden}.xp i{display:block;height:100%;background:var(--ac)}
.pf small{color:var(--mut);font-size:11px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sg div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11px;color:var(--mut)}

.lg{display:flex;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:8px;padding:8px 10px;margin-bottom:5px;font-size:12px}

</head>

S.log=S.log||[];S.nick=S.nick||'Игрок'+(1000+Math.floor(Math.random()*9000));S.av=S.av||0;S.free=S.free||0}
ensure();let page='U';
let tab=1,sel=new Set(),target=null,busy=false,spins=0,dep=0,q='',cat='',asc=true,lim=40;
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n*RATE).toLocaleString('ru-RU')+' ₽';
const save=()=>{S.inv.sort((a,b)=>CAT[b].p-CAT[a].p);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const sumSel=()=>[...sel].reduce((a,i)=>a+CAT[S.inv[i]].p,0);
const bet=()=>sumSel()+dep;
const chanceFor=t=>{const b=bet();if(t===null||!b||b>=CAT[t].p)return 0;return Math.min(95,b/CAT[t].p*100)};
const pc=c=>c<10?c.toFixed(2):c.toFixed(1);
let IMG={};try{IMG=JSON.parse(localStorage.getItem('skin-img-v2'))||{}}catch(e){}
const esc=t=>String(t).replace(/["<>&]/g,'');
const pic=s=>IMG[s.id]?`<img src="${esc(IMG[s.id])}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${s.e}'))">`:s.e;
const timg=id=>IMG[id]?`<img src="${esc(IMG[id])}" alt="">`:'';
const card=(s,on,i,extra)=>`<div class="sk ${on?'sel':''}" style="--c:${s.c};--g:${s.c}33" data-i="${i}"><div class="ic">${pic(s)}</div><b>${s.n}</b><span class="pr">${fmt(s.p)}</span>${extra||''}</div>`;
const col=c=>c>=50?'#7ddc3c':c>=25?'#ffd21f':'#ff4d4d';
function render(){
  ['U','C','P'].forEach(k=>$('pg'+k).style.display=page===k?'':'none');
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x.dataset.p===page));
  if(page==='C')renderCase();if(page==='P')renderProfile();
  dep=Math.min(dep,S.bal);
  $('bal').textContent=fmt(S.bal);
  $('hs').textContent=`Побед ${S.w} · Поражений ${S.l}`;
  $('hd').innerHTML=S.h.map(x=>`<i class="${x}"></i>`).join('');
  const ch=chanceFor(target),b=bet();
  const parts=[];if(sel.size)parts.push(`${sel.size} скин(ов)`);if(dep)parts.push(`+ ${fmt(dep)}`);
  $('from').innerHTML=b?`${sel.size?timg(S.inv[[...sel][0]]):''}<b>${parts.join(' ')}</b><span class="pr">${fmt(b)}</span>`:'<span class="chev">»</span>Выбери скины или добавь баланс';
  $('to').innerHTML=target!==null?`${timg(target)}<b>${CAT[target].n}</b><span class="pr">${fmt(CAT[target].p)}</span>`:'<span class="chev">?</span>Выбери цель';
  $('pct').textContent=(ch?pc(ch):'0')+'%';
  $('pct').style.color=ch?col(ch):'var(--mut)';
  $('arc').setAttribute('stroke-dasharray',`${264*ch/100} 264`);
  $('arc').style.color=$('arc').style.stroke=col(ch||100);
  $('go').disabled=!ch||busy;
  $('sell').disabled=!sel.size||busy;
  document.querySelectorAll('#presets button').forEach(x=>x.disabled=!b||busy);
  document.querySelectorAll('#dep button').forEach(x=>x.disabled=busy||!S.bal);
  $('t1').className=tab==1?'on':'';$('t2').className=tab==2?'on':'';
  $('ctl').style.display=tab==2?'block':'none';
  $('all').style.display=tab==1?'':'none';
  if(tab==1)$('list').innerHTML=S.inv.length?S.inv.map((id,i)=>card(CAT[id],sel.has(i),i)).join(''):'<div class="empty">Скинов нет. Добавь ставку с баланса или сбрось игру.</div>';
  else{
    const L=CAT.filter(s=>(!cat||s.w===cat)&&s.n.toLowerCase().includes(q)&&(!b||s.p>b)).sort((x,y)=>asc?x.p-y.p:y.p-x.p);
    $('list').innerHTML=(L.length?L.slice(0,lim).map(s=>{const c=chanceFor(s.id);return card(s,target===s.id,s.id,c?`<span class="ch">${pc(c)}%</span>`:'')}).join(''):'<div class="empty">Ничего не найдено</div>')+(L.length>lim?`<button class="more">Показать ещё (${L.length-lim})</button>`:'');
  }
}
$('list').onclick=e=>{
  if(busy)return;
  if(e.target.closest('.more')){lim+=40;render();return}
  const el=e.target.closest('.sk');if(!el)return;const i=+el.dataset.i;
  if(tab==1){sel.has(i)?sel.delete(i):sel.add(i)}else{target=target===i?null:i}
  $('msg').textContent='';render();
};
$('presets').onclick=e=>{
  const x=e.target.closest('button');if(!x||busy||!bet())return;
  const sm=bet(),want=x.dataset.m?sm*x.dataset.m:sm/(x.dataset.c/100);
  const cand=CAT.filter(c=>c.p>sm);
  if(!cand.length){$('msg').style.color='var(--bad)';$('msg').textContent='Нет скинов дороже твоей ставки';return}
  target=cand.reduce((a,c)=>Math.abs(Math.log(c.p/want))<Math.abs(Math.log(a.p/want))?c:a).id;
  $('msg').textContent='';render();
};
$('dep').onclick=e=>{
  const x=e.target.closest('button');if(!x||busy)return;const d=x.dataset.d;
  dep=d==='0'?0:d==='all'?S.bal:Math.min(S.bal,dep+d/RATE);render();
};
$('t1').onclick=()=>{tab=1;render()};$('t2').onclick=()=>{tab=2;lim=40;render()};
$('q').oninput=e=>{q=e.target.value.trim().toLowerCase();lim=40;render()};
$('chips').onclick=e=>{
  const x=e.target.closest('button');if(!x)return;
  if(x.id==='srt'){asc=!asc;x.textContent=asc?'Цена ↑':'Цена ↓'}
  else{cat=x.dataset.cat;document.querySelectorAll('#chips button[data-cat]').forEach(y=>y.classList.toggle('on',y===x))}
  lim=40;render();
};
$('sell').onclick=()=>{S.bal+=sumSel();S.inv=S.inv.filter((_,i)=>!sel.has(i));sel.clear();save();render()};
$('all').onclick=()=>{S.inv.forEach((_,i)=>sel.add(i));render()};
$('reset').onclick=()=>{if(confirm('Сбросить всё?')){const nk=S.nick,av=S.av;S=fresh();ensure();S.nick=nk;S.av=av;sel.clear();target=null;dep=0;$('msg').textContent='';save();render()}};
$('ovb').onclick=()=>$('ov').classList.remove('show');
$('go').onclick=()=>{
  const ch=chanceFor(target),roll=Math.random()*100,win=roll<ch,t=target,d=dep,bt=bet();
  busy=true;$('msg').textContent='';render();
  spins++;$('ptr').style.transform=`rotate(${360*(3+spins*3)+roll*3.6}deg)`;
  setTimeout(()=>{
    const gone=sel;S.inv=S.inv.filter((_,i)=>!gone.has(i));S.bal-=d;
    if(win){S.inv.push(t);S.w++;S.st.won+=CAT[t].p;noteDrop(CAT[t]);if(!S.st.luck||ch<S.st.luck){S.st.luck=ch;S.st.luckId=t}}else S.l++;
    S.st.up++;S.st.wag+=bt;S.log=[...S.log,{t,ch,w:win,b:bt}].slice(-15);
    S.h=[...S.h,win?'w':'l'].slice(-12);
    const rg=$('ring');rg.className='ring '+(win?'win':'lose');setTimeout(()=>rg.className='ring',2200);
    $('ovp').innerHTML=win?pic(CAT[t]):'💥';
    $('ovt').textContent=win?'Победа!':'Не повезло';
    $('ovt').style.color=win?'var(--ok)':'var(--bad)';
    $('ovs').textContent=win?`${CAT[t].n} · ${fmt(CAT[t].p)}`:'Ставка сгорела';
    $('ov').classList.add('show');
    sel.clear();dep=0;if(win)target=null;busy=false;save();render();
  },3700);
};
const noteDrop=c=>{if(S.st.best==null||c.p>CAT[S.st.best].p)S.st.best=c.id};
const pool=CAT.filter(c=>c.p*RATE<=500),wt=c=>1/(c.p+.5);
const pick=()=>{let r=Math.random()*pool.reduce((a,c)=>a+wt(c),0);for(const c of pool){r-=wt(c);if(r<=0)return c}return pool[0]};
let caseBusy=false;
function updCase(){
  const b=$('copen');if(!b)return;const left=CD-(Date.now()-S.free);
  if(caseBusy){b.textContent='Открываем…';b.disabled=true}
  else if(left>0){const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);b.textContent=`Следующий кейс через ${m}:${String(s).padStart(2,'0')}`;b.disabled=true}
  else{b.textContent='Открыть бесплатно';b.disabled=false}
}
setInterval(updCase,1000);
function renderCase(){
  const tot=pool.reduce((a,c)=>a+wt(c),0);
  $('cin').innerHTML=[...pool].sort((x,y)=>y.p-x.p).map(c=>card(c,false,c.id,`<span class="ch">${(wt(c)/tot*100).toFixed(1)}%</span>`)).join('');
  updCase();
}
$('copen').onclick=()=>{
  if(caseBusy||Date.now()-S.free<CD)return;caseBusy=true;
  const win=pick(),WI=34,W=88,tr=$('ctr');
  tr.style.transition='none';tr.style.transform='translateX(0)';
  tr.innerHTML=Array.from({length:40},(_,i)=>{const c=i===WI?win:pick();return`<div class="ci" style="--c:${c.c};--g:${c.c}33">${pic(c)}<small>${fmt(c.p)}</small></div>`}).join('');
  const cw=$('cwin').clientWidth,jit=(Math.random()-.5)*W*.6;void tr.offsetWidth;
  tr.style.transition='transform 5s cubic-bezier(.1,.6,.1,1)';
  tr.style.transform=`translateX(${-(WI*W+W/2-cw/2+jit)}px)`;
  S.free=Date.now();save();updCase();
  setTimeout(()=>{
    S.inv.push(win.id);S.st.cases++;noteDrop(win);save();caseBusy=false;
    $('ovp').innerHTML=pic(win);$('ovt').textContent='Тебе выпало!';$('ovt').style.color='var(--ac)';
    $('ovs').textContent=`${win.n} · ${fmt(win.p)}`;$('ov').classList.add('show');render();
  },5200);
};
function renderProfile(){
  const st=S.st,xp=st.up*10+st.cases*5,lv=1+Math.floor(xp/100),inv=S.inv.reduce((a,id)=>a+CAT[id].p,0),pr=st.won-st.wag;
  const wr=st.up?Math.round(S.w/st.up*100):0;
  const cell=(l,v,c)=>`<div>${l}<b${c?` style="color:${c}"`:''}>${v}</b></div>`;
  $('pgP').innerHTML=`<div class="pf"><div class="av" id="av">${AV[S.av%AV.length]}</div><div style="flex:1"><input id="nick" maxlength="16" value="${esc(S.nick)}"><div class="xp"><i style="width:${xp%100}%"></i></div><small>Уровень ${lv} · ${xp%100}/100 опыта</small></div></div>
  <h3>Статистика</h3><div class="sg">
  ${cell('Апгрейдов',st.up)}${cell('Винрейт',wr+'%',col(wr))}${cell('Побед',S.w,'var(--ok)')}${cell('Поражений',S.l,'var(--bad)')}
  ${cell('Поставлено всего',fmt(st.wag))}${cell('Выиграно скинами',fmt(st.won))}
  ${cell('Профит',(pr>=0?'+':'−')+fmt(Math.abs(pr)),pr>=0?'var(--ok)':'var(--bad)')}${cell('Кейсов открыто',st.cases)}
  ${cell('Стоимость инвентаря',fmt(inv))}${cell('Скинов в инвентаре',S.inv.length)}</div>
  <h3>Лучший дроп</h3>${st.best!=null?`<div class="grid">${card(CAT[st.best],false,st.best)}</div>`:'<div class="empty">Пока ничего</div>'}
  ${st.luckId!=null?`<div class="cinfo" style="margin-top:8px">Самая везучая победа: ${CAT[st.luckId].n} при шансе ${pc(st.luck)}%</div>`:''}
  <h3>История апгрейдов</h3>${S.log.length?[...S.log].reverse().map(x=>`<div class="lg ${x.w?'w':''}"><div>${CAT[x.t].n}<span>шанс ${pc(x.ch)}% · ставка ${fmt(x.b)}</span></div><b>${x.w?'+'+fmt(CAT[x.t].p-x.b):'−'+fmt(x.b)}</b></div>`).join(''):'<div class="empty">Ещё нет апгрейдов</div>'}`;
}
$('pgP').onclick=e=>{if(e.target.closest('#av')){S.av=(S.av+1)%AV.length;save();renderProfile()}};
$('pgP').oninput=e=>{if(e.target.id==='nick'){S.nick=e.target.value.slice(0,16);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(x){}}};
$('nav').onclick=e=>{const x=e.target.closest('button');if(!x)return;page=x.dataset.p;render()};
const norm=n=>String(n).toLowerCase().replace(/\s*\([^)]*\)\s*$/,'').replace(/^★\s*/,'').replace(/[’`]/g,"'").trim();
async function loadImages(){
  if(localStorage.getItem('skin-img-done')==='1'&&Object.keys(IMG).length)return;
  const urls=['https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en/skins.json','https://cdn.jsdelivr.net/gh/ByMykel/CSGO-API@main/public/api/en/skins.json'];
  for(const u of urls){
    try{
      const arr=await (await fetch(u)).json(),m={};
      for(const k of arr){
        const nm=String(k.name||'');
        if(!k.image||/stattrak|souvenir/i.test(nm))continue;
        const key=norm(nm);if(!m[key])m[key]=k.image;
      }
      CAT.forEach(c=>{const v=m[norm(c.n)];if(v)IMG[c.id]=v});
      try{localStorage.setItem('skin-img-v2',JSON.stringify(IMG));localStorage.setItem('skin-img-done','1')}catch(e){}
      render();return;
    }catch(e){}
  }
}
render();loadImages();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
